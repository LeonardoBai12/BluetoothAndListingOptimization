# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9's default ("new DSL" + built-in Kotlin) drops the separate
# org.jetbrains.kotlin.android plugin and, with it, kapt support. This
# project opts back out of both and keeps the classic
# kotlin("android") + kotlin("kapt") setup: kapt is still what most Dagger
# tutorials/docs assume, and this is a study project about
# BLE/RecyclerView/Compose/ANR, not about the newest Gradle plugin wiring.
# The com.android.build.api.dsl.* types the convention plugins compile
# against (build-logic/convention) are unaffected by this flag -- it only
# changes which extension implementation the `android { }` block binds to at
# *runtime*, not the compile-time API shape.
# Google has said both flags are removed in AGP 10 -- if this project is ever
# bumped past AGP 9.x, revisit this (migrate Dagger's annotation processing
# to `ksp(...)` and drop both flags + the kapt plugin).
android.builtInKotlin=false
android.newDsl=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official